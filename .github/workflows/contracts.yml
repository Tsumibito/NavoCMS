name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: navocms_test
          POSTGRES_PASSWORD: navocms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d navocms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install catalogue browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate contracts, boundaries, build, and tests
        run: pnpm check

      - name: Verify PostgreSQL tenant isolation
        env:
          PGPASSWORD: navocms_test
        run: |
          psql -h 127.0.0.1 -U postgres -d navocms_test \
            -f packages/persistence-postgres/migrations/0001_multitenancy_and_rls.sql
          psql -h 127.0.0.1 -U postgres -d navocms_test \
            -f packages/persistence-postgres/tests/rls-isolation.sql
          psql -h 127.0.0.1 -U postgres -d navocms_test \
            -f packages/persistence-postgres/migrations/0002_content_engine.sql
          psql -h 127.0.0.1 -U postgres -d navocms_test \
            -f packages/persistence-postgres/tests/content-isolation.sql
          psql -h 127.0.0.1 -U postgres -d navocms_test \
            -f packages/persistence-postgres/migrations/0003_runtime_foundation.sql
          psql -h 127.0.0.1 -U postgres -d navocms_test \
            -f packages/persistence-postgres/tests/runtime-isolation.sql

      - name: Build production container
        run: docker build --tag navocms:${{ github.sha }} .
